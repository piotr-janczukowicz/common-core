name: Pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      security-events: write
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-pull-request.yml@fed50ba5192dce79a5862e856be3d5463980a505 # v18
    secrets: inherit
