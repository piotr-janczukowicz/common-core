name: Pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-pull-request.yml@c9f1a5381f07b58dbcefe999d7edb8a9e936fe2b # v16
    secrets: inherit
